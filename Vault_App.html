function getMimeType(filename) {
  const ext = filename.split('.').pop().toLowerCase();
  const map = {
    'pdf': 'application/pdf',
    'mp4': 'video/mp4', 'mkv': 'video/mp4', 'webm': 'video/webm', 'mov': 'video/quicktime',
    'mp3': 'audio/mpeg', 'wav': 'audio/wav', 'ogg': 'audio/ogg', 'flac': 'audio/flac',
    'png': 'image/png', 'jpg': 'image/jpeg', 'jpeg': 'image/jpeg', 'gif': 'image/gif', 'webp': 'image/webp',
    'txt': 'text/plain', 'json': 'application/json', 'py': 'text/plain', 'js': 'text/javascript'
  };
  return map[ext] || 'application/octet-stream';
}

function clearMemoryAndPreview() {
  if (activeObjectUrl) {
    URL.revokeObjectURL(activeObjectUrl);
    activeObjectUrl = null;
  }
  const wrapper = document.getElementById("previewWrapper");
  wrapper.innerHTML = "";
  wrapper.style.display = "none";
  if (autoWipeTimer) clearTimeout(autoWipeTimer);
}

function startLockoutCooldown(seconds) {
  lockoutSecondsRemaining = seconds;
  const input = document.getElementById("passInput");
  const btnPlay = document.getElementById("btnPlay");
  const btnUnlock = document.getElementById("btnUnlock");
  const btnLock = document.getElementById("btnLock");
  const badge = document.getElementById("fileBadge");

  input.disabled = true;
  btnPlay.disabled = true;
  btnUnlock.disabled = true;
  btnLock.disabled = true;

  badge.className = "status-badge badge-lockout";
  badge.innerHTML = `⚠️ Lockout (${lockoutSecondsRemaining}s)`;
  showToast(`🛑 <strong>BRUTE-FORCE LOCKOUT ACTIVE</strong>. Rate limiter engaged. Please wait <strong>${lockoutSecondsRemaining}s</strong>.`, "warning");

  if (lockoutTimer) clearInterval(lockoutTimer);
  lockoutTimer = setInterval(() => {
    lockoutSecondsRemaining--;
    if (lockoutSecondsRemaining <= 0) {
      clearInterval(lockoutTimer);
      input.disabled = false;
      btnPlay.disabled = false;
      btnUnlock.disabled = false;
      btnLock.disabled = false;
      badge.className = "status-badge badge-locked";
      badge.innerHTML = "🔒 Ready";
      showToast("ℹ️ Lockout expired. You may now attempt authentication.", "info");
    } else {
      badge.innerHTML = `⚠️ Lockout (${lockoutSecondsRemaining}s)`;
    }
  }, 1000);
}

async function updateFileUI(file) {
  if (!file) return;
  clearMemoryAndPreview();

  const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
  const ext = file.name.split('.').pop().toLowerCase();
  
  let icon = "📄";
  if (['mp4','mkv','webm','mov','avi','vid'].includes(ext)) icon = "🎬";
  else if (['jpg','jpeg','png','gif','webp','svg','bmp'].includes(ext)) icon = "🖼️";
  else if (['mp3','wav','ogg','flac','m4a'].includes(ext)) icon = "🎵";
  else if (['pdf'].includes(ext)) icon = "📕";
  else if (['zip','rar','7z','tar','gz'].includes(ext)) icon = "📦";
  else if (['txt','py','js','json','html','css','c','cpp','md'].includes(ext)) icon = "📝";

  document.getElementById("dropContent").innerHTML = `
    <div class="file-chip">
      <span>${icon}</span>
      <span>${file.name}</span>
    </div>
    <div class="dropzone-subtitle" style="margin-top:4px;">${sizeMB} MB • Zero-Carve Armor Ready</div>
  `;

  const badge = document.getElementById("fileBadge");
  let isLocked = false;
  let modeName = "Encrypted";

  if (file.size >= FOOTER_LEN_V4) {
    const foot4 = new Uint8Array(await file.slice(file.size - FOOTER_LEN_V4, file.size).arrayBuffer());
    const m = String.fromCharCode(...foot4.slice(0, 8));
    if (m === MAGIC_V4) {
      isLocked = true;
      const cSize = new DataView(foot4.buffer).getUint32(8, true);
      modeName = cSize === 0 ? "🔒 100% Full Armor" : "🔒 Header Armor";
    } else if (m === MAGIC_V3) {
      isLocked = true;
      modeName = "🔒 Header Armor (V3)";
    }
  }
  if (!isLocked && file.size >= FOOTER_LEN_V2) {
    const foot2 = new Uint8Array(await file.slice(file.size - FOOTER_LEN_V2, file.size).arrayBuffer());
    const m = String.fromCharCode(...foot2.slice(0, 8));
    if (m === MAGIC_V2 || m === MAGIC_V1) {
      isLocked = true;
      modeName = "🔒 Header Armor (Legacy)";
    }
  }

  if (isLocked) {
    badge.className = "status-badge badge-locked";
    badge.innerHTML = modeName;
  } else {
    badge.className = "status-badge badge-unlocked";
    badge.innerHTML = "🔓 Unencrypted";
  }
}

const fileInput = document.getElementById("fileInput");
fileInput.addEventListener("change", (e) => {
  if (e.target.files && e.target.files.length) {
    updateFileUI(e.target.files[0]);
  }
});

const dropZone = document.getElementById("dropZone");
dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("dragover"); });
dropZone.addEventListener("dragleave", () => { dropZone.classList.remove("dragover"); });
dropZone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropZone.classList.remove("dragover");
  if (e.dataTransfer.files && e.dataTransfer.files.length) {
    fileInput.files = e.dataTransfer.files;
    updateFileUI(e.dataTransfer.files[0]);
  }
});

function showToast(msg, type) {

  el.style.display = "block";
  el.className = "toast-alert alert-" + type;
  el.innerHTML = msg;
}

function renderMediaPreview(blob, filename) {
  clearMemoryAndPreview();
  const wrapper = document.getElementById("previewWrapper");
  wrapper.style.display = "block";

  const ext = filename.split('.').pop().toLowerCase();
  activeObjectUrl = URL.createObjectURL(blob);

  const panicBar = document.createElement("div");
  panicBar.className = "panic-bar";
  panicBar.innerHTML = `
    <span style="font-size:0.75rem; color:var(--text-secondary);">🔒 In-Memory Decryption (Auto-wipe in 3m)</span>
    <button class="panic-btn" onclick="clearMemoryAndPreview()">Wipe RAM</button>
  `;
  wrapper.appendChild(panicBar);

  if (['mp4','webm','mkv','mov','avi','vid'].includes(ext)) {
    const video = document.createElement("video");
    video.src = activeObjectUrl;
    video.controls = true;
    video.playsInline = true;
    video.autoplay = true;
    wrapper.appendChild(video);
  } else if (['mp3','wav','ogg','flac','m4a'].includes(ext)) {
    const audio = document.createElement("audio");
    audio.src = activeObjectUrl;
    audio.controls = true;
    audio.autoplay = true;
    audio.style.padding = "20px";
    wrapper.appendChild(audio);
  } else if (['jpg','jpeg','png','gif','webp','svg','bmp'].includes(ext)) {
    const img = document.createElement("img");
    img.src = activeObjectUrl;
    wrapper.appendChild(img);
  } else if (['pdf'].includes(ext)) {
    const iframe = document.createElement("iframe");
    iframe.src = activeObjectUrl;
    wrapper.appendChild(iframe);
  } else if (['txt','json','py','js','html','css','csv','md','log','xml'].includes(ext)) {
    const reader = new FileReader();
    reader.onload = () => {
      const pre = document.createElement("pre");
      pre.className = "text-preview";
      pre.textContent = reader.result;
      wrapper.appendChild(pre);
    };
    reader.readAsText(blob);
  } else {
    const box = document.createElement("div");
    box.style.padding = "24px";
    box.style.textAlign = "center";
    box.style.color = "var(--text-secondary)";
    box.innerHTML = `<div style="font-size: 2rem; margin-bottom: 8px;">📦</div><strong>${filename}</strong><div style="font-size: 0.8rem; margin-top: 4px;">Decrypted in RAM. Click <strong>Unlock & Save</strong> to export.</div>`;
    wrapper.appendChild(box);
  }

  // Auto-wipe RAM after 3 minutes of inactivity
  autoWipeTimer = setTimeout(() => {
    clearMemoryAndPreview();
    showToast("🛡️ RAM Auto-Wiped for security after 3 minutes.", "info");
  }, 180000);
}

async function deriveKeyAndAuth(password, salt, version = 4) {
  const enc = new TextEncoder();
  const passKey = await crypto.subtle.importKey(
    "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveBits"]
  );
  const iters = version >= 3 ? KDF_ITERS_V4 : 10000;
  const derivedBits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: salt, iterations: iters, hash: "SHA-256" },
    passKey, 256
  );
  const keyBytes = new Uint8Array(derivedBits);

  let tag = "VAULT_AUTH_V4";
  if (version === 3) tag = "VAULT_AUTH_V3";
  else if (version === 2) tag = "VAULT_AUTH_V2";
  else if (version === 1) tag = "AUTH_CHECK_V1";

  const tagBytes = enc.encode(tag);
  const authData = new Uint8Array(32 + tagBytes.length + 16);
  authData.set(keyBytes, 0);
  authData.set(tagBytes, 32);
  authData.set(salt, 32 + tagBytes.length);

  const authHashBuffer = await crypto.subtle.digest("SHA-256", authData);
  const authHash = new Uint8Array(authHashBuffer);

  return { keyBytes, authHash };
}

async function handleAction(action) {
  const passInput = document.getElementById("passInput");

  if (lockoutSecondsRemaining > 0) {
    showToast(`🛑 Lockout active. Please wait ${lockoutSecondsRemaining}s.`, "warning");
    return;
  }

  if (!fileInput.files || !fileInput.files.length) {
    showToast("⚠️ <strong>No file selected</strong>. Tap above to select a file.", "error");
    return;
  }
  const password = passInput.value;
  if (!password) {
    showToast("⚠️ <strong>Password required</strong>. Please enter your master key.", "error");
    passInput.focus();
    return;
  }

  const file = fileInput.files[0];
  const t0 = performance.now();
  showToast("⚡ Processing cryptographic stream in RAM...", "info");

  try {
    const fileSize = file.size;

    if (action === "unlock" || action === "play") {
      let version = 0;
      let footerBuf = null;
      let footerLen = 0;

      if (fileSize >= FOOTER_LEN_V4) {
        const buf = new Uint8Array(await file.slice(fileSize - FOOTER_LEN_V4, fileSize).arrayBuffer());
        const m = String.fromCharCode(...buf.slice(0, 8));
        if (m === MAGIC_V4) { version = 4; footerBuf = buf; footerLen = FOOTER_LEN_V4; }
        else if (m === MAGIC_V3) { version = 3; footerBuf = buf; footerLen = FOOTER_LEN_V3; }
      }
      if (!version && fileSize >= FOOTER_LEN_V2) {
        const buf = new Uint8Array(await file.slice(fileSize - FOOTER_LEN_V2, fileSize).arrayBuffer());
        const m = String.fromCharCode(...buf.slice(0, 8));
        if (m === MAGIC_V2) { version = 2; footerBuf = buf; footerLen = FOOTER_LEN_V2; }
        else if (m === MAGIC_V1) { version = 1; footerBuf = buf; footerLen = FOOTER_LEN_V2; }
      }

      if (!version) {
        if (action === "play") {
          renderMediaPreview(file, file.name);
          showToast("ℹ️ <strong>Direct Preview</strong>: File is unencrypted.", "success");
          return;
        } else {
          showToast("ℹ️ This file is already unlocked.", "info");
          return;
        }
      }

      const chunkSize = new DataView(footerBuf.buffer).getUint32(8, true);
      const salt = footerBuf.slice(12, 28);
      const iv = footerBuf.slice(28, 44);
      const storedAuth = footerBuf.slice(44, 76);

      const cryptoInfo = await deriveKeyAndAuth(password, salt, version);

      // Constant-Time Comparison to prevent micro-timing attacks
      let diff = 0;
      for (let i = 0; i < 32; i++) {
        diff |= (storedAuth[i] ^ cryptoInfo.authHash[i]);
      }

      if (diff !== 0) {
        failedAttempts++;
        cryptoInfo.keyBytes.fill(0); // Zeroize failed key buffer

        if (failedAttempts >= 10) {
          startLockoutCooldown(60);
          return;
        } else if (failedAttempts >= 5) {
          startLockoutCooldown(10);
          return;
        } else if (failedAttempts >= 3) {
          startLockoutCooldown(3);
          return;
        }

        const rem = 10 - failedAttempts;
        showToast(`❌ <strong>INCORRECT PASSWORD</strong> (${failedAttempts} failed attempts, ${rem} left before lockout).`, "error");
        return;
      }

      // Successful Auth - Reset failed attempt counter
      failedAttempts = 0;

      const dataLen = fileSize - footerLen;
      const isFull = (version === 4 && chunkSize === 0);
      let restoredBlob = null;
      const mime = getMimeType(file.name);

      if (isFull) {
        const encDataBlob = file.slice(0, dataLen);
        const encDataBuf = new Uint8Array(await encDataBlob.arrayBuffer());
        const encBlocksLen = dataLen - (dataLen % 16);
        
        let decryptedData;
        if (encBlocksLen > 0) {
          const decBlocks = aesDecryptCbc(cryptoInfo.keyBytes, iv, encDataBuf.subarray(0, encBlocksLen));
          if (dataLen % 16 !== 0) {
            decryptedData = new Uint8Array(dataLen);
            decryptedData.set(decBlocks, 0);
            decryptedData.set(encDataBuf.subarray(encBlocksLen), encBlocksLen);
          } else {
            decryptedData = decBlocks;
          }
        } else {
          decryptedData = encDataBuf;
        }
        restoredBlob = new Blob([decryptedData], { type: mime });
      } else {
        const encHeaderBlob = file.slice(0, chunkSize);
        const encHeaderBuf = new Uint8Array(await encHeaderBlob.arrayBuffer());
        const decryptedHeader = aesDecryptCbc(cryptoInfo.keyBytes, iv, encHeaderBuf);
        const restBlob = file.slice(chunkSize, dataLen);
        restoredBlob = new Blob([decryptedHeader, restBlob], { type: mime });
      }

      cryptoInfo.keyBytes.fill(0); // Zeroize key buffer from RAM

      const elapsed = (performance.now() - t0).toFixed(1);

      if (action === "play") {
        renderMediaPreview(restoredBlob, file.name);
        showToast(`⚡ <strong>Decrypted in ${elapsed}ms</strong> • Streaming in memory (0 extra disk space)`, "success");
      } else {
        downloadBlob(restoredBlob, file.name);
        showToast(`✅ <strong>Restored in ${elapsed}ms!</strong> File downloaded.`, "success");
      }

    } else if (action === "lock") {
      const isFull = (fileSize < 50 * 1024 * 1024);
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(16));
      const cryptoInfo = await deriveKeyAndAuth(password, salt, 4);

      let lockedBlob;

      if (isFull) {
        const fullBuf = new Uint8Array(await file.arrayBuffer());
        const encBlocksLen = fileSize - (fileSize % 16);
        
        let encData;
        if (encBlocksLen > 0) {
          const encBlocks = aesEncryptCbc(cryptoInfo.keyBytes, iv, fullBuf.subarray(0, encBlocksLen));
          if (fileSize % 16 !== 0) {
            encData = new Uint8Array(fileSize);
            encData.set(encBlocks, 0);
            encData.set(fullBuf.subarray(encBlocksLen), encBlocksLen);
          } else {
            encData = encBlocks;
          }
        } else {
          encData = fullBuf;
        }

        const footer = new Uint8Array(FOOTER_LEN_V4);
        for (let i = 0; i < 8; i++) footer[i] = MAGIC_V4.charCodeAt(i);
        new DataView(footer.buffer).setUint32(8, 0, true);
        footer.set(salt, 12);
        footer.set(iv, 28);
        footer.set(cryptoInfo.authHash, 44);
        new DataView(footer.buffer).setUint16(76, 0, true);
        new DataView(footer.buffer).setUint16(78, 1, true);

        lockedBlob = new Blob([encData, footer], { type: "application/octet-stream" });
      } else {
        let chunkSize = Math.min(fileSize, 65536);
        chunkSize = chunkSize - (chunkSize % 16);

        const headerBlob = file.slice(0, chunkSize);
        const headerBuf = new Uint8Array(await headerBlob.arrayBuffer());
        const encHeader = aesEncryptCbc(cryptoInfo.keyBytes, iv, headerBuf);

        const footer = new Uint8Array(FOOTER_LEN_V4);
        for (let i = 0; i < 8; i++) footer[i] = MAGIC_V4.charCodeAt(i);
        new DataView(footer.buffer).setUint32(8, chunkSize, true);
        footer.set(salt, 12);
        footer.set(iv, 28);
        footer.set(cryptoInfo.authHash, 44);
        new DataView(footer.buffer).setUint16(76, 0, true);
        new DataView(footer.buffer).setUint16(78, 0, true);

        const restBlob = file.slice(chunkSize, fileSize);
        lockedBlob = new Blob([encHeader, restBlob, footer], { type: "application/octet-stream" });
      }

      cryptoInfo.keyBytes.fill(0); // Zeroize key buffer

      const elapsed = (performance.now() - t0).toFixed(1);
      downloadBlob(lockedBlob, file.name);
      showToast(`🔒 <strong>Locked in ${elapsed}ms!</strong> ${isFull ? '100% Full-File Armor' : 'Fast Media Armor'}.`, "success");
    }
  } catch (err) {
    showToast("❌ <strong>Error</strong>: " + err.message, "error");
  }
}

function downloadBlob(blob, filename) {
  const a = document.createElement("a");
  const url = URL.createObjectURL(blob);
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
</script>
