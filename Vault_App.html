<title>Universal Vault V5 | Authenticated Enterprise Encryption</title>
<style>
  :root {
    --bg-base: #06090f;
    --bg-surface: rgba(15, 23, 42, 0.82);
    --border-subtle: rgba(255, 255, 255, 0.08);
    --border-accent: rgba(56, 189, 248, 0.4);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-tertiary: #64748b;
    --accent-cyan: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.25);
    --accent-emerald: #10b981;
    --accent-rose: #f43f5e;
    --accent-amber: #f59e0b;
    --radius-xl: 24px;
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: var(--font-sans);
    background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0c1322 45%, var(--bg-base) 80%);
    color: var(--text-primary);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    top: -20%; left: -20%; width: 140%; height: 140%;
    background: radial-gradient(circle at 85% 15%, rgba(129, 140, 248, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 15% 85%, rgba(56, 189, 248, 0.1) 0%, transparent 40%);
    pointer-events: none;
    z-index: 0;
  }
  .app-container {
    width: 100%;
    max-width: 580px;
    background: var(--bg-surface);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-xl);
    padding: 28px 24px;
    position: relative;
    z-index: 1;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 40px -10px rgba(56, 189, 248, 0.15);
    animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .brand-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }
  .brand-title {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-icon {
    width: 42px;
    height: 42px;
    border-radius: var(--radius-md);
    background: linear-gradient(135deg, rgba(56,189,248,0.25), rgba(129,140,248,0.25));
    border: 1px solid var(--border-accent);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent-cyan);
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.35);
  }
  .brand-text h1 {
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: -0.3px;
    background: linear-gradient(135deg, #ffffff 30%, var(--accent-cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .brand-text span {
    font-size: 0.72rem;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }
  .status-badge {
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border: 1px solid transparent;
    transition: all 0.3s;
  }
  .badge-idle { background: rgba(100, 116, 139, 0.15); color: var(--text-tertiary); border-color: rgba(100, 116, 139, 0.2); }
  .badge-locked { background: rgba(244, 63, 94, 0.15); color: var(--accent-rose); border-color: rgba(244, 63, 94, 0.3); }
  .badge-unlocked { background: rgba(16, 185, 129, 0.15); color: var(--accent-emerald); border-color: rgba(16, 185, 129, 0.3); }
  .badge-lockout { background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); border-color: rgba(245, 158, 11, 0.3); }

  .dropzone {
    position: relative;
    border: 2px dashed rgba(255, 255, 255, 0.14);
    border-radius: var(--radius-lg);
    padding: 26px 16px;
    text-align: center;
    background: rgba(11, 17, 33, 0.6);
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    margin-bottom: 20px;
    overflow: hidden;
  }
  .dropzone:hover, .dropzone:active, .dropzone.dragover {
    border-color: var(--accent-cyan);
    background: rgba(56, 189, 248, 0.08);
    box-shadow: 0 8px 25px -5px var(--accent-glow);
  }
  .dropzone-file-input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
    z-index: 10;
    display: block;
  }
  .dropzone-icon {
    width: 48px;
    height: 48px;
    margin: 0 auto 10px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent-cyan);
    pointer-events: none;
    transition: all 0.2s;
  }
  .dropzone-title {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 4px;
    pointer-events: none;
  }
  .dropzone-subtitle {
    font-size: 0.78rem;
    color: var(--text-secondary);
    pointer-events: none;
  }
  .file-chip {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--accent-cyan);
    word-break: break-all;
    pointer-events: none;
  }
  .field-group { margin-bottom: 20px; }
  .field-label-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .field-label {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-secondary);
  }
  .security-badge {
    font-size: 0.72rem;
    color: var(--accent-cyan);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .input-wrapper { position: relative; display: flex; align-items: center; }
  .input-icon { position: absolute; left: 14px; color: var(--text-tertiary); pointer-events: none; display: flex; }
  .vault-input {
    width: 100%;
    background: rgba(11, 17, 33, 0.85);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 14px 44px 14px 42px;
    font-size: 0.95rem;
    color: var(--text-primary);
    outline: none;
    transition: all 0.2s;
  }
  .vault-input:focus {
    border-color: var(--accent-cyan);
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    background: rgba(11, 17, 33, 1);
  }
  .vault-input:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    border-color: rgba(244, 63, 94, 0.4);
  }
  .toggle-eye {
    position: absolute;
    right: 12px;
    background: none;
    border: none;
    color: var(--text-tertiary);
    cursor: pointer;
    padding: 6px;
    display: flex;
    transition: color 0.2s;
  }
  .toggle-eye:hover { color: var(--text-primary); }

  .actions-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .btn {
    border: none;
    border-radius: var(--radius-md);
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 16px;
    font-size: 0.92rem;
    min-height: 48px;
  }
  .btn:active:not(:disabled) { transform: scale(0.97); }
  .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .btn-primary {
    grid-column: span 2;
    background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
    color: #ffffff;
    font-size: 1rem;
    box-shadow: 0 4px 20px -2px rgba(37, 99, 235, 0.5);
  }
  .btn-primary:hover:not(:disabled) { background: linear-gradient(135deg, #60a5fa 0%, #1d4ed8 100%); }
  .btn-secondary {
    background: rgba(30, 41, 59, 0.7);
    color: #e2e8f0;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .btn-secondary:hover:not(:disabled) { background: rgba(51, 65, 85, 0.9); color: #ffffff; }
  .btn-unlock { color: #4ade80; border-color: rgba(34, 197, 94, 0.25); }
  .btn-unlock:hover:not(:disabled) { background: rgba(34, 197, 94, 0.15); border-color: #22c55e; }

  .toast-alert {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: var(--radius-md);
    font-size: 0.86rem;
    line-height: 1.45;
    display: none;
    animation: slideDown 0.3s ease;
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .alert-success { background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.3); color: #6ee7b7; }
  .alert-error { background: rgba(244, 63, 94, 0.12); border: 1px solid rgba(244, 63, 94, 0.3); color: #fda4af; }
  .alert-info { background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.3); color: #7dd3fc; }
  .alert-warning { background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.3); color: #fcd34d; }

  .progress-wrap {
    margin-top: 14px;
    display: none;
  }
  .progress-wrap.active { display: block; }
  .progress-track {
    width: 100%;
    height: 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.06);
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, #38bdf8, #10b981);
    transition: width 0.12s linear;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    color: #94a3b8;
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }
  .progress-label {
    font-size: 0.82rem;
    color: #cbd5e1;
    margin-bottom: 6px;
  }

  .preview-wrapper {
    margin-top: 20px;
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: #000000;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 15px 30px rgba(0,0,0,0.6);
    display: none;
    position: relative;
  }
  .preview-wrapper video, .preview-wrapper audio, .preview-wrapper img, .preview-wrapper iframe {
    width: 100%;
    display: block;
    max-height: 420px;
  }
  .preview-wrapper img { object-fit: contain; background: #0b0f19; padding: 8px; }
  .preview-wrapper iframe { height: 420px; border: none; background: #ffffff; }
  .text-preview {
    max-height: 320px;
    overflow-y: auto;
    padding: 16px;
    background: #0b0f19;
    color: #e2e8f0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 0.85rem;
    white-space: pre-wrap;
    word-break: break-all;
    line-height: 1.5;
  }
  .panic-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: rgba(15, 23, 42, 0.95);
    border-bottom: 1px solid var(--border-subtle);
  }
  .panic-btn {
    background: rgba(244, 63, 94, 0.2);
    border: 1px solid rgba(244, 63, 94, 0.4);
    color: #fda4af;
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
  }
  .panic-btn:hover { background: rgba(244, 63, 94, 0.4); color: #ffffff; }

  @media (max-width: 480px) {
    body { padding: 12px; }
    .app-container { padding: 20px 16px; border-radius: 20px; }
    .brand-text h1 { font-size: 1.05rem; }
    .btn { padding: 12px 14px; font-size: 0.86rem; }
    .btn-primary { padding: 14px; font-size: 0.95rem; }
  }
</style>
</head>

  <div class="preview-wrapper" id="previewWrapper"></div>
</div>

<script>
const FOOTER_LEN_V5 = 96;
const FOOTER_LEN_V5_RESUMABLE = 104;
const FOOTER_LEN_V4 = 80;
const FOOTER_LEN_V3 = 80;
const FOOTER_LEN_V2 = 76;
const MAGIC_V5 = "VAULTV05";
const MAGIC_V4 = "VAULTV04";
const MAGIC_V3 = "VAULTV03";
const MAGIC_V2 = "VAULTV02";
const MAGIC_V1 = "HDRLOK01";
const KDF_ITERS_V5 = 600000;

let failedAttempts = 0;
let lockoutTimer = null;
let lockoutSecondsRemaining = 0;
let activeObjectUrl = null;
let autoWipeTimer = null;

function togglePasswordVisibility() {
  const input = document.getElementById("passInput");
  const eye = document.getElementById("eyeIcon");
  if (input.type === "password") {
    input.type = "text";
    eye.innerHTML = `<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" y1="2" x2="22" y2="22"></line>`;
  } else {
    input.type = "password";
    eye.innerHTML = `<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle>`;
  }
}

function getMimeType(filename) {
  const ext = filename.split('.').pop().toLowerCase();
  const map = {
    'pdf': 'application/pdf',
    'mp4': 'video/mp4', 'mkv': 'video/mp4', 'webm': 'video/webm', 'mov': 'video/quicktime',
    'mp3': 'audio/mpeg', 'wav': 'audio/wav', 'ogg': 'audio/ogg', 'flac': 'audio/flac',
    'png': 'image/png', 'jpg': 'image/jpeg', 'jpeg': 'image/jpeg', 'gif': 'image/gif', 'webp': 'image/webp',
    'txt': 'text/plain', 'json': 'application/json', 'py': 'text/plain', 'js': 'text/javascript'
  };
  return map[ext] || 'application/octet-stream';
}

function clearMemoryAndPreview() {
  if (activeObjectUrl) {
    URL.revokeObjectURL(activeObjectUrl);
    activeObjectUrl = null;
  }
  const wrapper = document.getElementById("previewWrapper");
  wrapper.innerHTML = "";
  wrapper.style.display = "none";
  if (autoWipeTimer) clearTimeout(autoWipeTimer);
}

function startLockoutCooldown(seconds) {
  lockoutSecondsRemaining = seconds;
  const input = document.getElementById("passInput");
  const btnPlay = document.getElementById("btnPlay");
  const btnUnlock = document.getElementById("btnUnlock");
  const btnLock = document.getElementById("btnLock");
  const badge = document.getElementById("fileBadge");

  input.disabled = true;
  btnPlay.disabled = true;
  btnUnlock.disabled = true;
  btnLock.disabled = true;

  badge.className = "status-badge badge-lockout";
  badge.innerHTML = `⚠️ Lockout (${lockoutSecondsRemaining}s)`;
  showToast(`🛑 <strong>BRUTE-FORCE LOCKOUT ACTIVE</strong>. Rate limiter engaged. Please wait <strong>${lockoutSecondsRemaining}s</strong>.`, "warning");

  if (lockoutTimer) clearInterval(lockoutTimer);
  lockoutTimer = setInterval(() => {
    lockoutSecondsRemaining--;
    if (lockoutSecondsRemaining <= 0) {
      clearInterval(lockoutTimer);
      input.disabled = false;
      btnPlay.disabled = false;
      btnUnlock.disabled = false;
      btnLock.disabled = false;
      badge.className = "status-badge badge-locked";
      badge.innerHTML = "🔒 Ready";
      showToast("ℹ️ Lockout expired. You may now attempt authentication.", "info");
    } else {
      badge.innerHTML = `⚠️ Lockout (${lockoutSecondsRemaining}s)`;
    }
  }, 1000);
}

async function updateFileUI(file) {
  if (!file) return;
  clearMemoryAndPreview();

  const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
  const ext = file.name.split('.').pop().toLowerCase();
  
  let icon = "📄";
  if (['mp4','mkv','webm','mov','avi','vid'].includes(ext)) icon = "🎬";
  else if (['jpg','jpeg','png','gif','webp','svg','bmp'].includes(ext)) icon = "🖼️";
  else if (['mp3','wav','ogg','flac','m4a'].includes(ext)) icon = "🎵";
  else if (['pdf'].includes(ext)) icon = "📕";
  else if (['zip','rar','7z','tar','gz'].includes(ext)) icon = "📦";
  else if (['txt','py','js','json','html','css','c','cpp','md'].includes(ext)) icon = "📝";

  document.getElementById("dropContent").innerHTML = `
    <div class="file-chip">
      <span id="dropIconSpan"></span>
      <span id="dropNameSpan"></span>
    </div>
    <div class="dropzone-subtitle" style="margin-top:4px;" id="dropSubtitleSpan"></div>
  `;
  document.getElementById("dropIconSpan").textContent = icon;
  document.getElementById("dropNameSpan").textContent = file.name;
  document.getElementById("dropSubtitleSpan").textContent = `${sizeMB} MB • V5 Authenticated Stream Ready`;

  const badge = document.getElementById("fileBadge");
  let isLocked = false;
  let modeName = "Encrypted";
  let interruptedState = 0; // 0 = normal, 1 = lock in progress, 2 = unlock in progress

  // Check the 104-byte resumable V5 footer FIRST (this is what tools/vault.py and
  // header_vault.ps1 now write for every V5.5 lock, including fully completed ones).
  if (file.size >= FOOTER_LEN_V5_RESUMABLE) {
    const foot5r = new Uint8Array(await file.slice(file.size - FOOTER_LEN_V5_RESUMABLE, file.size).arrayBuffer());
    const m = String.fromCharCode(...foot5r.slice(0, 8));
    if (m === MAGIC_V5) {
      isLocked = true;
      const dv = new DataView(foot5r.buffer);
      const state = dv.getUint16(102, true); // offset 92+8+2 = 102 within the 104-byte slice
      interruptedState = state;
      if (state === 1) modeName = "⚠️ V5 LOCK INTERRUPTED";
      else if (state === 2) modeName = "⚠️ V5 UNLOCK INTERRUPTED";
      else modeName = "🔒 V5 Full AEAD Armor";
    }
  }
  // Fall back to the older fixed 96-byte V5 footer (legacy pre-resumable V5 files).
  if (!isLocked && file.size >= FOOTER_LEN_V5) {
    const foot5 = new Uint8Array(await file.slice(file.size - FOOTER_LEN_V5, file.size).arrayBuffer());
    const m = String.fromCharCode(...foot5.slice(0, 8));
    if (m === MAGIC_V5) {
      isLocked = true;
      modeName = "🔒 V5 Full AEAD Armor";
    }
  }
  if (!isLocked && file.size >= FOOTER_LEN_V4) {
    const foot4 = new Uint8Array(await file.slice(file.size - FOOTER_LEN_V4, file.size).arrayBuffer());
    const m = String.fromCharCode(...foot4.slice(0, 8));
    if (m === MAGIC_V4 || m === MAGIC_V3) {
      isLocked = true;
      modeName = "🔒 V4 Full Armor";
    }
  }

  if (isLocked) {
    badge.className = "status-badge badge-locked";
    badge.innerHTML = modeName;
    if (interruptedState !== 0) {
      showToast("⚠️ <strong>This file has an interrupted operation</strong> (closed terminal, crash, or power loss mid lock/unlock). This web app can't safely resume it — use Lock.bat/Unlock.bat or vault.py on desktop to resume forward or roll back to the original.", "warning");
    }
  } else {
    badge.className = "status-badge badge-unlocked";
    badge.innerHTML = "🔓 Unencrypted";
  }
}

const fileInput = document.getElementById("fileInput");
fileInput.addEventListener("change", (e) => {
  if (e.target.files && e.target.files.length) updateFileUI(e.target.files[0]);
});

const dropZone = document.getElementById("dropZone");
dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("dragover"); });
dropZone.addEventListener("dragleave", () => { dropZone.classList.remove("dragover"); });
dropZone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropZone.classList.remove("dragover");
  if (e.dataTransfer.files && e.dataTransfer.files.length) {
    fileInput.files = e.dataTransfer.files;
    updateFileUI(e.dataTransfer.files[0]);
  }
});

function showToast(msg, type) {
  const el = document.getElementById("toastAlert");
  el.style.display = "block";
  el.className = "toast-alert alert-" + type;
  el.innerHTML = msg;
}

function renderMediaPreview(blob, filename) {
  clearMemoryAndPreview();
  const wrapper = document.getElementById("previewWrapper");
  wrapper.style.display = "block";

  const ext = filename.split('.').pop().toLowerCase();
  activeObjectUrl = URL.createObjectURL(blob);

  const panicBar = document.createElement("div");

    <span style="font-size:0.75rem; color:var(--text-secondary);">🔒 Authenticated In-Memory Stream (Auto-wipe in 3m)</span>
    <button class="panic-btn" onclick="clearMemoryAndPreview()">Wipe RAM</button>
  `;
  wrapper.appendChild(panicBar);

  if (['mp4','webm','mkv','mov','avi','vid'].includes(ext)) {

    video.controls = true;
    video.playsInline = true;
    video.autoplay = true;
    wrapper.appendChild(video);
  } else if (['mp3','wav','ogg','flac','m4a'].includes(ext)) {

    audio.src = activeObjectUrl;
    audio.controls = true;
    audio.autoplay = true;
    audio.style.padding = "20px";
    wrapper.appendChild(audio);
  } else if (['jpg','jpeg','png','gif','webp','svg','bmp'].includes(ext)) {

    img.src = activeObjectUrl;
    wrapper.appendChild(img);
  } else if (['pdf'].includes(ext)) {
    const iframe = document.createElement("iframe");
    iframe.src = activeObjectUrl;
    wrapper.appendChild(iframe);
  } else if (['txt','json','py','js','html','css','csv','md','log','xml'].includes(ext)) {
    const reader = new FileReader();
    reader.onload = () => {
      const pre = document.createElement("pre");
      pre.className = "text-preview";
      pre.textContent = reader.result;
      wrapper.appendChild(pre);
    };
    reader.readAsText(blob);
  } else {
    const box = document.createElement("div");
    box.style.padding = "24px";
    box.style.textAlign = "center";
    box.style.color = "var(--text-secondary)";
    const iconDiv = document.createElement("div");
    iconDiv.style.fontSize = "2rem";
    iconDiv.style.marginBottom = "8px";
    iconDiv.textContent = "📦";
    const nameStrong = document.createElement("strong");
    nameStrong.textContent = filename;
    const subDiv = document.createElement("div");
    subDiv.style.fontSize = "0.8rem";
    subDiv.style.marginTop = "4px";
    const subStrong = document.createElement("strong");
    subStrong.textContent = "Unlock & Save";
    subDiv.appendChild(document.createTextNode("Verified in RAM. Click "));
    subDiv.appendChild(subStrong);
    subDiv.appendChild(document.createTextNode(" to export."));
    box.appendChild(iconDiv);
    box.appendChild(nameStrong);
    box.appendChild(subDiv);
    wrapper.appendChild(box);
  }

  autoWipeTimer = setTimeout(() => {
    clearMemoryAndPreview();
    showToast("🛡️ RAM Auto-Wiped for security after 3 minutes.", "info");
  }, 180000);
}

// ---- Progress bar helpers ----
const PROGRESS_CHUNK = 4 * 1024 * 1024; // 4MB per chunk — matches desktop engine granularity closely enough for a smooth bar
let progressStartTime = 0;

function showProgress(label) {
  const wrap = document.getElementById("progressWrap");
  wrap.classList.add("active");
  document.getElementById("progressLabel").textContent = label;
  document.getElementById("progressFill").style.width = "0%";
  document.getElementById("progressStats").textContent = "0 / 0 MB";
  document.getElementById("progressEta").textContent = "ETA: --:--";
  progressStartTime = performance.now();
}

function updateProgress(doneBytes, totalBytes) {
  const pct = totalBytes > 0 ? Math.min(100, (doneBytes / totalBytes) * 100) : 0;
  document.getElementById("progressFill").style.width = pct.toFixed(1) + "%";
  const doneMb = (doneBytes / (1024 * 1024)).toFixed(1);
  const totalMb = (totalBytes / (1024 * 1024)).toFixed(1);
  document.getElementById("progressStats").textContent = `${doneMb} / ${totalMb} MB  •  ${pct.toFixed(1)}%`;

  const elapsedS = (performance.now() - progressStartTime) / 1000;
  if (doneBytes > 0 && elapsedS > 0.15) {
    const bytesPerSec = doneBytes / elapsedS;
    const remainingBytes = totalBytes - doneBytes;
    const etaS = Math.max(0, remainingBytes / bytesPerSec);
    document.getElementById("progressEta").textContent = "ETA: " + formatEta(etaS);
  }
}

function formatEta(seconds) {
  const s = Math.round(seconds);
  const hh = Math.floor(s / 3600);
  const mm = Math.floor((s % 3600) / 60);
  const ss = s % 60;
  const pad = (n) => String(n).padStart(2, "0");
  return hh > 0 ? `${pad(hh)}:${pad(mm)}:${pad(ss)}` : `${pad(mm)}:${pad(ss)}`;
}

function hideProgress() {
  document.getElementById("progressWrap").classList.remove("active");
}

// Increment a 16-byte big-endian counter (matches WebCrypto AES-CTR / the desktop
// engines' convention) by `blocks` 16-byte blocks.
function incrementCounter(counter, blocks) {
  const c = new Uint8Array(counter);
  let carry = blocks;
  for (let i = 15; i >= 0 && carry > 0; i--) {
    const sum = c[i] + (carry % 256);
    c[i] = sum & 0xff;
    carry = Math.floor(carry / 256) + (sum > 0xff ? 1 : 0);
  }
  return c;
}

// Chunked AES-CTR encrypt/decrypt with progress reporting. AES-CTR is a stream
// cipher applied independently per 16-byte block, so splitting the input into
// PROGRESS_CHUNK-sized pieces and encrypting each with the correctly-advanced
// counter gives byte-identical output to one giant subtle.encrypt/decrypt call —
// this only changes *how* we call WebCrypto, not the ciphertext produced.
async function ctrTransformChunked(aesKey, baseCounter, data, mode, onProgress) {
  const total = data.length;
  const out = new Uint8Array(total);
  let offset = 0;
  while (offset < total) {
    const end = Math.min(offset + PROGRESS_CHUNK, total);
    const slice = data.subarray(offset, end);
    const blockOffset = Math.floor(offset / 16); // offset is always chunk-aligned except the final slice, and PROGRESS_CHUNK is a multiple of 16
    const chunkCounter = incrementCounter(baseCounter, blockOffset);
    const resultBuf = mode === "encrypt"
      ? await crypto.subtle.encrypt({ name: "AES-CTR", counter: chunkCounter, length: 128 }, aesKey, slice)
      : await crypto.subtle.decrypt({ name: "AES-CTR", counter: chunkCounter, length: 128 }, aesKey, slice);
    out.set(new Uint8Array(resultBuf), offset);
    offset = end;
    if (onProgress) onProgress(offset, total);
    // Yield to the browser so the progress bar actually paints between chunks.
    await new Promise((r) => setTimeout(r, 0));
  }
  return out;
}

async function deriveKeysV5(password, salt) {
  const enc = new TextEncoder();
  const passKey = await crypto.subtle.importKey(
    "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveBits"]
  );
  const derivedBits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: salt, iterations: KDF_ITERS_V5, hash: "SHA-256" },
    passKey, 512
  );
  const dk = new Uint8Array(derivedBits);
  const encKeyBytes = dk.slice(0, 32);
  const macKeyBytes = dk.slice(32, 64);

  const hmacKey = await crypto.subtle.importKey(
    "raw", macKeyBytes, { name: "HMAC", hash: "SHA-256" }, false, ["sign", "verify"]
  );
  const tagData = new Uint8Array(13 + 16);
  tagData.set(enc.encode("VAULT_AUTH_V5"), 0);
  tagData.set(salt, 13);
  const fullAuthTag = new Uint8Array(await crypto.subtle.sign("HMAC", hmacKey, tagData));
  const authTag = fullAuthTag.slice(0, 16);

  return { encKeyBytes, macKeyBytes, hmacKey, authTag };
}

async function handleAction(action) {
  const passInput = document.getElementById("passInput");

  if (lockoutSecondsRemaining > 0) {
    showToast(`🛑 Lockout active. Please wait ${lockoutSecondsRemaining}s.`, "warning");
    return;
  }

  if (!fileInput.files || !fileInput.files.length) {
    showToast("⚠️ <strong>No file selected</strong>. Tap above to select a file.", "error");
    return;
  }
  const password = passInput.value;
  if (!password) {
    showToast("⚠️ <strong>Password required</strong>. Please enter your master key.", "error");
    passInput.focus();
    return;
  }

  const file = fileInput.files[0];
  const t0 = performance.now();
  showToast("⚡ Processing authenticated cryptographic stream in RAM...", "info");

  try {
    const fileSize = file.size;

    if (action === "unlock" || action === "play") {
      let version = 0;
      let footerBuf = null;
      let footerLen = 0;
      let opState = 0;

      // Try the 104-byte resumable V5 footer first — this is the current format
      // written by tools/vault.py and header_vault.ps1 for every V5.5 lock.
      if (fileSize >= FOOTER_LEN_V5_RESUMABLE) {
        const buf = new Uint8Array(await file.slice(fileSize - FOOTER_LEN_V5_RESUMABLE, fileSize).arrayBuffer());
        const m = String.fromCharCode(...buf.slice(0, 8));
        if (m === MAGIC_V5) {
          version = 5; footerBuf = buf; footerLen = FOOTER_LEN_V5_RESUMABLE;
          opState = new DataView(buf.buffer).getUint16(102, true);
        }
      }
      // Fall back to the older fixed 96-byte V5 footer.
      if (!version && fileSize >= FOOTER_LEN_V5) {
        const buf = new Uint8Array(await file.slice(fileSize - FOOTER_LEN_V5, fileSize).arrayBuffer());
        const m = String.fromCharCode(...buf.slice(0, 8));
        if (m === MAGIC_V5) { version = 5; footerBuf = buf; footerLen = FOOTER_LEN_V5; }
      }
      if (!version && fileSize >= FOOTER_LEN_V4) {
        const buf = new Uint8Array(await file.slice(fileSize - FOOTER_LEN_V4, fileSize).arrayBuffer());
        const m = String.fromCharCode(...buf.slice(0, 8));
        if (m === MAGIC_V4) { version = 4; footerBuf = buf; footerLen = FOOTER_LEN_V4; }
      }

      if (!version) {
        if (action === "play") {
          renderMediaPreview(file, file.name);
          showToast("ℹ️ <strong>Direct Preview</strong>: File is unencrypted.", "success");
          return;
        } else {
          showToast("ℹ️ This file is already unlocked.", "info");
          return;
        }
      }

      if (opState !== 0) {
        const which = opState === 1 ? "a LOCK" : "an UNLOCK";
        showToast(`🛑 <strong>Interrupted operation detected</strong>: this file was left mid-way through ${which} (closed terminal, crash, or power loss). Opening it here would read torn/partial data. Please use Lock.bat / Unlock.bat / vault.py on desktop first — they can resume it forward or roll it back to the original safely.`, "error");
        return;
      }

      const dataLen = fileSize - footerLen;
      const salt = footerBuf.slice(12, 28);
      const nonce = footerBuf.slice(28, 44);
      const mime = getMimeType(file.name);

      if (version === 5) {
        const storedMac = footerBuf.slice(44, 76);
        const storedAuthTag = footerBuf.slice(76, 92);

        const cryptoInfo = await deriveKeysV5(password, salt);

        // Constant-time AuthTag verification
        let diff = 0;
        for (let i = 0; i < 16; i++) diff |= (storedAuthTag[i] ^ cryptoInfo.authTag[i]);

        if (diff !== 0) {
          failedAttempts++;
          cryptoInfo.encKeyBytes.fill(0);
          cryptoInfo.macKeyBytes.fill(0);

          if (failedAttempts >= 10) startLockoutCooldown(60);
          else if (failedAttempts >= 5) startLockoutCooldown(10);
          else if (failedAttempts >= 3) startLockoutCooldown(3);

          showToast(`❌ <strong>INCORRECT PASSWORD</strong> (${failedAttempts} failed attempts).`, "error");
          return;
        }

        failedAttempts = 0;

        showProgress(`🔍 Verifying integrity — ${file.name}`);

        // Ciphertext integrity verification (Anti-Tampering HMAC).
        // WebCrypto's HMAC has no streaming API, so we read+concat in chunks
        // (progress reflects the read) then sign once over the full buffer.
        const cipherBuf = new Uint8Array(dataLen);
        let readOff = 0;
        while (readOff < dataLen) {
          const end = Math.min(readOff + PROGRESS_CHUNK, dataLen);
          const part = new Uint8Array(await file.slice(readOff, end).arrayBuffer());
          cipherBuf.set(part, readOff);
          readOff = end;
          updateProgress(readOff, dataLen);
          await new Promise((r) => setTimeout(r, 0));
        }
        const computedMac = new Uint8Array(await crypto.subtle.sign("HMAC", cryptoInfo.hmacKey, cipherBuf));

        let macDiff = 0;
        for (let i = 0; i < 32; i++) macDiff |= (storedMac[i] ^ computedMac[i]);

        if (macDiff !== 0) {
          hideProgress();
          showToast("❌ <strong>INTEGRITY CORRUPTION</strong>: Ciphertext was modified or corrupted! Decryption halted.", "error");
          return;
        }

        // Authenticated Stream Decryption via AES-CTR (chunked, with progress)
        showProgress(`🔓 Decrypting — ${file.name}`);
        const aesKey = await crypto.subtle.importKey(
          "raw", cryptoInfo.encKeyBytes, { name: "AES-CTR" }, false, ["decrypt"]
        );
        const decryptedBuf = await ctrTransformChunked(aesKey, nonce, cipherBuf, "decrypt", updateProgress);

        cryptoInfo.encKeyBytes.fill(0);
        cryptoInfo.macKeyBytes.fill(0);
        hideProgress();

        const restoredBlob = new Blob([decryptedBuf], { type: mime });
        const elapsed = (performance.now() - t0).toFixed(1);

        if (action === "play") {
          renderMediaPreview(restoredBlob, file.name);
          showToast(`⚡ <strong>Verified & Decrypted in ${elapsed}ms</strong> • Streaming in RAM`, "success");
        } else {
          downloadBlob(restoredBlob, file.name);
          showToast(`✅ <strong>Restored in ${elapsed}ms!</strong> (AEAD Integrity Verified)`, "success");
        }
      }

    } else if (action === "lock") {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const nonce = crypto.getRandomValues(new Uint8Array(16));
      const cryptoInfo = await deriveKeysV5(password, salt);

      showProgress(`📖 Reading — ${file.name}`);
      const totalSize = file.size;
      const fileBuf = new Uint8Array(totalSize);
      let readOff2 = 0;
      while (readOff2 < totalSize) {
        const end = Math.min(readOff2 + PROGRESS_CHUNK, totalSize);
        const part = new Uint8Array(await file.slice(readOff2, end).arrayBuffer());
        fileBuf.set(part, readOff2);
        readOff2 = end;
        updateProgress(readOff2, totalSize);
        await new Promise((r) => setTimeout(r, 0));
      }

      // Encrypt 100% full file with AES-CTR (chunked, with progress)
      showProgress(`🔒 Encrypting — ${file.name}`);
      const aesKey = await crypto.subtle.importKey(
        "raw", cryptoInfo.encKeyBytes, { name: "AES-CTR" }, false, ["encrypt"]
      );
      const cipherBuf = await ctrTransformChunked(aesKey, nonce, fileBuf, "encrypt", updateProgress);

      // Calculate master HMAC-SHA256 over ciphertext (Encrypt-then-MAC)
      showProgress(`🛡️ Sealing — ${file.name}`);
      const masterMac = new Uint8Array(await crypto.subtle.sign("HMAC", cryptoInfo.hmacKey, cipherBuf));
      hideProgress();

      // Build V5 Footer (104-byte resumable layout, matching tools/vault.py and
      // header_vault.ps1). Browser locks complete atomically in one pass in memory,
      // so this is always written already-finalized: checkpoint=0, fails=0,
      // state=STATE_NORMAL_LOCKED(0).
      const footer = new Uint8Array(FOOTER_LEN_V5_RESUMABLE);
      for (let i = 0; i < 8; i++) footer[i] = MAGIC_V5.charCodeAt(i);
      new DataView(footer.buffer).setUint32(8, 65536, true);
      footer.set(salt, 12);
      footer.set(nonce, 28);
      footer.set(masterMac, 44);
      footer.set(cryptoInfo.authTag, 76);
      // bytes [92:100] checkpoint (uint64 LE) = 0 (already zero-initialized)
      // bytes [100:102] fails (uint16 LE) = 0 (already zero-initialized)
      new DataView(footer.buffer).setUint16(102, 0, true); // state = STATE_NORMAL_LOCKED

      cryptoInfo.encKeyBytes.fill(0);
      cryptoInfo.macKeyBytes.fill(0);

      const lockedBlob = new Blob([cipherBuf, footer], { type: "application/octet-stream" });
      const elapsed = (performance.now() - t0).toFixed(1);

      downloadBlob(lockedBlob, file.name);
      showToast(`🔒 <strong>Locked in ${elapsed}ms!</strong> (100% Full-File AEAD + 600k PBKDF2).`, "success");
    }
  } catch (err) {
    hideProgress();
    showToast("❌ <strong>Error</strong>: " + err.message, "error");
  }
}

function downloadBlob(blob, filename) {
  const a = document.createElement("a");
  const url = URL.createObjectURL(blob);
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
</script>
