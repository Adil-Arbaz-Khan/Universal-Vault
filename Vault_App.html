<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: blob:; media-src blob:; frame-src blob:; object-src blob:;">
<meta name="theme-color" content="#06090f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Universal Vault V5 | Authenticated Enterprise Encryption</title>
<style>
  :root {
    --bg-base: #06090f;
    --bg-surface: rgba(15, 23, 42, 0.82);
    --border-subtle: rgba(255, 255, 255, 0.08);
    --border-accent: rgba(56, 189, 248, 0.4);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-tertiary: #64748b;
    --accent-cyan: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.25);
    --accent-emerald: #10b981;
    --accent-rose: #f43f5e;
    --accent-amber: #f59e0b;
    --radius-xl: 24px;
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: var(--font-sans);
    background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0c1322 45%, var(--bg-base) 80%);
    color: var(--text-primary);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    top: -20%; left: -20%; width: 140%; height: 140%;
    background: radial-gradient(circle at 85% 15%, rgba(129, 140, 248, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 15% 85%, rgba(56, 189, 248, 0.1) 0%, transparent 40%);
    pointer-events: none;
    z-index: 0;
  }
  .app-container {
    width: 100%;
    max-width: 580px;
    background: var(--bg-surface);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-xl);
    padding: 28px 24px;
    position: relative;
    z-index: 1;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 40px -10px rgba(56, 189, 248, 0.15);
    animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .brand-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }
  .brand-title {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-icon {
    width: 42px;
    height: 42px;
    border-radius: var(--radius-md);
    background: linear-gradient(135deg, rgba(56,189,248,0.25), rgba(129,140,248,0.25));
    border: 1px solid var(--border-accent);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent-cyan);
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.35);
  }
  .brand-text h1 {
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: -0.3px;
    background: linear-gradient(135deg, #ffffff 30%, var(--accent-cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .brand-text span {
    font-size: 0.72rem;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }
  .status-badge {
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border: 1px solid transparent;
    transition: all 0.3s;
  }
  .badge-idle { background: rgba(100, 116, 139, 0.15); color: var(--text-tertiary); border-color: rgba(100, 116, 139, 0.2); }
  .badge-locked { background: rgba(244, 63, 94, 0.15); color: var(--accent-rose); border-color: rgba(244, 63, 94, 0.3); }
  .badge-unlocked { background: rgba(16, 185, 129, 0.15); color: var(--accent-emerald); border-color: rgba(16, 185, 129, 0.3); }
  .badge-lockout { background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); border-color: rgba(245, 158, 11, 0.3); }

  .dropzone {
    position: relative;
    border: 2px dashed rgba(255, 255, 255, 0.14);
    border-radius: var(--radius-lg);
    padding: 26px 16px;
    text-align: center;
    background: rgba(11, 17, 33, 0.6);
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    margin-bottom: 20px;
    overflow: hidden;
  }
  .dropzone:hover, .dropzone:active, .dropzone.dragover {
    border-color: var(--accent-cyan);
    background: rgba(56, 189, 248, 0.08);
    box-shadow: 0 8px 25px -5px var(--accent-glow);
  }
  .dropzone-file-input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
    z-index: 10;
    display: block;
  }
  .dropzone-icon {
    width: 48px;
    height: 48px;
    margin: 0 auto 10px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent-cyan);
    pointer-events: none;
    transition: all 0.2s;
  }
  .dropzone-title {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 4px;
    pointer-events: none;
  }
  .dropzone-subtitle {
    font-size: 0.78rem;
    color: var(--text-secondary);
    pointer-events: none;
  }
  .file-chip {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--accent-cyan);
    word-break: break-all;
    pointer-events: none;
  }
  .field-group { margin-bottom: 20px; }
  .field-label-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .field-label {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-secondary);
  }
  .security-badge {
    font-size: 0.72rem;
    color: var(--accent-cyan);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .input-wrapper { position: relative; display: flex; align-items: center; }
  .input-icon { position: absolute; left: 14px; color: var(--text-tertiary); pointer-events: none; display: flex; }
  .vault-input {
    width: 100%;
    background: rgba(11, 17, 33, 0.85);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 14px 44px 14px 42px;
    font-size: 0.95rem;
    color: var(--text-primary);
    outline: none;
    transition: all 0.2s;
  }
  .vault-input:focus {
    border-color: var(--accent-cyan);
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    background: rgba(11, 17, 33, 1);
  }
  .vault-input:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    border-color: rgba(244, 63, 94, 0.4);
  }
  .toggle-eye {
    position: absolute;
    right: 12px;
    background: none;
    border: none;
    color: var(--text-tertiary);
    cursor: pointer;
    padding: 6px;
    display: flex;
    transition: color 0.2s;
  }
  .toggle-eye:hover { color: var(--text-primary); }

  .actions-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .btn {
    border: none;
    border-radius: var(--radius-md);
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 16px;
    font-size: 0.92rem;
    min-height: 48px;
  }
  .btn:active:not(:disabled) { transform: scale(0.97); }
  .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .btn-primary {
    grid-column: span 2;
    background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
    color: #ffffff;
    font-size: 1rem;
    box-shadow: 0 4px 20px -2px rgba(37, 99, 235, 0.5);
  }
  .btn-primary:hover:not(:disabled) { background: linear-gradient(135deg, #60a5fa 0%, #1d4ed8 100%); }
  .btn-secondary {
    background: rgba(30, 41, 59, 0.7);
    color: #e2e8f0;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .btn-secondary:hover:not(:disabled) { background: rgba(51, 65, 85, 0.9); color: #ffffff; }
  .btn-unlock { color: #4ade80; border-color: rgba(34, 197, 94, 0.25); }
  .btn-unlock:hover:not(:disabled) { background: rgba(34, 197, 94, 0.15); border-color: #22c55e; }

  .toast-alert {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: var(--radius-md);
    font-size: 0.86rem;
    line-height: 1.45;
    display: none;
    animation: slideDown 0.3s ease;
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .alert-success { background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.3); color: #6ee7b7; }
  .alert-error { background: rgba(244, 63, 94, 0.12); border: 1px solid rgba(244, 63, 94, 0.3); color: #fda4af; }
  .alert-info { background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.3); color: #7dd3fc; }
  .alert-warning { background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.3); color: #fcd34d; }

  .preview-wrapper {
    margin-top: 20px;
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: #000000;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 15px 30px rgba(0,0,0,0.6);
    display: none;
    position: relative;
  }
  .preview-wrapper video, .preview-wrapper audio, .preview-wrapper img, .preview-wrapper iframe {
    width: 100%;
    display: block;
    max-height: 420px;
  }
  .preview-wrapper img { object-fit: contain; background: #0b0f19; padding: 8px; }
  .preview-wrapper iframe { height: 420px; border: none; background: #ffffff; }
  .text-preview {
    max-height: 320px;
    overflow-y: auto;
    padding: 16px;
    background: #0b0f19;
    color: #e2e8f0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 0.85rem;
    white-space: pre-wrap;
    word-break: break-all;
    line-height: 1.5;
  }
  .panic-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: rgba(15, 23, 42, 0.95);
    border-bottom: 1px solid var(--border-subtle);
  }
  .panic-btn {
    background: rgba(244, 63, 94, 0.2);
    border: 1px solid rgba(244, 63, 94, 0.4);
    color: #fda4af;
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
  }
  .panic-btn:hover { background: rgba(244, 63, 94, 0.4); color: #ffffff; }

  @media (max-width: 480px) {
    body { padding: 12px; }
    .app-container { padding: 20px 16px; border-radius: 20px; }
    .brand-text h1 { font-size: 1.05rem; }
    .btn { padding: 12px 14px; font-size: 0.86rem; }
    .btn-primary { padding: 14px; font-size: 0.95rem; }
  }
</style>
</head>
<body>

<div class="app-container">
  <div class="brand-header">
    <div class="brand-title">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
      </div>
      <div class="brand-text">
        <h1>Universal Vault V5</h1>
        <span>Authenticated Stream AEAD &bull; EtM Integrity</span>
      </div>
    </div>
    <div id="fileBadge" class="status-badge badge-idle">No File Selected</div>
  </div>

  <div class="dropzone" id="dropZone">
    <input type="file" id="fileInput" class="dropzone-file-input" accept="*/*">
    <div class="dropzone-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </svg>
    </div>
    <div id="dropContent">
      <div class="dropzone-title">Tap to Choose Any File or Video</div>
      <div class="dropzone-subtitle">PDFs, Images, Office Docs, Audio, Videos & Folders</div>
    </div>
  </div>

  <div class="field-group">
    <div class="field-label-row">
      <label class="field-label" for="passInput">Master Password</label>
      <div class="security-badge" id="securityIndicator">
        <span>🛡️ 250k PBKDF2 + HMAC-SHA256</span>
      </div>
    </div>
    <div class="input-wrapper">
      <div class="input-icon">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="15" r="4"></circle>
          <path d="m10.85 12.15 7.65-7.65a2 2 0 0 1 2.83 2.83L19.5 9"></path>
          <line x1="15.5" y1="6.5" x2="18.5" y2="9.5"></line>
        </svg>
      </div>
      <input type="password" id="passInput" class="vault-input" placeholder="Enter master key..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button type="button" class="toggle-eye" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
        <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </div>
  </div>

  <div class="actions-grid">
    <button class="btn btn-primary" id="btnPlay" onclick="handleAction('play')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
      Stream & Preview in RAM
    </button>
    <button class="btn btn-secondary btn-unlock" id="btnUnlock" onclick="handleAction('unlock')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
      </svg>
      Unlock & Save
    </button>
    <button class="btn btn-secondary" id="btnLock" onclick="handleAction('lock')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      Lock & Save (V5 Full AEAD)
    </button>
  </div>

  <div id="toastAlert" class="toast-alert"></div>

  <div class="preview-wrapper" id="previewWrapper"></div>
</div>

<script>
const FOOTER_LEN_V5 = 96;
const FOOTER_LEN_V4 = 80;
const FOOTER_LEN_V3 = 80;
const FOOTER_LEN_V2 = 76;
const MAGIC_V5 = "VAULTV05";
const MAGIC_V4 = "VAULTV04";
const MAGIC_V3 = "VAULTV03";
const MAGIC_V2 = "VAULTV02";
const MAGIC_V1 = "HDRLOK01";
const KDF_ITERS_V5 = 250000;

let failedAttempts = 0;
let lockoutTimer = null;
let lockoutSecondsRemaining = 0;
let activeObjectUrl = null;
let autoWipeTimer = null;

function togglePasswordVisibility() {
  const input = document.getElementById("passInput");
  const eye = document.getElementById("eyeIcon");
  if (input.type === "password") {
    input.type = "text";
    eye.innerHTML = `<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" y1="2" x2="22" y2="22"></line>`;
  } else {
    input.type = "password";
    eye.innerHTML = `<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle>`;
  }
}

function getMimeType(filename) {
  const ext = filename.split('.').pop().toLowerCase();
  const map = {
    'pdf': 'application/pdf',
    'mp4': 'video/mp4', 'mkv': 'video/mp4', 'webm': 'video/webm', 'mov': 'video/quicktime',
    'mp3': 'audio/mpeg', 'wav': 'audio/wav', 'ogg': 'audio/ogg', 'flac': 'audio/flac',
    'png': 'image/png', 'jpg': 'image/jpeg', 'jpeg': 'image/jpeg', 'gif': 'image/gif', 'webp': 'image/webp',
    'txt': 'text/plain', 'json': 'application/json', 'py': 'text/plain', 'js': 'text/javascript'
  };
  return map[ext] || 'application/octet-stream';
}

function clearMemoryAndPreview() {
  if (activeObjectUrl) {
    URL.revokeObjectURL(activeObjectUrl);
    activeObjectUrl = null;
  }
  const wrapper = document.getElementById("previewWrapper");
  wrapper.innerHTML = "";
  wrapper.style.display = "none";
  if (autoWipeTimer) clearTimeout(autoWipeTimer);
}

function startLockoutCooldown(seconds) {
  lockoutSecondsRemaining = seconds;
  const input = document.getElementById("passInput");
  const btnPlay = document.getElementById("btnPlay");
  const btnUnlock = document.getElementById("btnUnlock");
  const btnLock = document.getElementById("btnLock");
  const badge = document.getElementById("fileBadge");

  input.disabled = true;
  btnPlay.disabled = true;
  btnUnlock.disabled = true;
  btnLock.disabled = true;

  badge.className = "status-badge badge-lockout";
  badge.innerHTML = `⚠️ Lockout (${lockoutSecondsRemaining}s)`;
  showToast(`🛑 <strong>BRUTE-FORCE LOCKOUT ACTIVE</strong>. Rate limiter engaged. Please wait <strong>${lockoutSecondsRemaining}s</strong>.`, "warning");

  if (lockoutTimer) clearInterval(lockoutTimer);
  lockoutTimer = setInterval(() => {
    lockoutSecondsRemaining--;
    if (lockoutSecondsRemaining <= 0) {
      clearInterval(lockoutTimer);
      input.disabled = false;
      btnPlay.disabled = false;
      btnUnlock.disabled = false;
      btnLock.disabled = false;
      badge.className = "status-badge badge-locked";
      badge.innerHTML = "🔒 Ready";
      showToast("ℹ️ Lockout expired. You may now attempt authentication.", "info");
    } else {
      badge.innerHTML = `⚠️ Lockout (${lockoutSecondsRemaining}s)`;
    }
  }, 1000);
}

async function updateFileUI(file) {
  if (!file) return;
  clearMemoryAndPreview();

  const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
  const ext = file.name.split('.').pop().toLowerCase();
  
  let icon = "📄";
  if (['mp4','mkv','webm','mov','avi','vid'].includes(ext)) icon = "🎬";
  else if (['jpg','jpeg','png','gif','webp','svg','bmp'].includes(ext)) icon = "🖼️";
  else if (['mp3','wav','ogg','flac','m4a'].includes(ext)) icon = "🎵";
  else if (['pdf'].includes(ext)) icon = "📕";
  else if (['zip','rar','7z','tar','gz'].includes(ext)) icon = "📦";
  else if (['txt','py','js','json','html','css','c','cpp','md'].includes(ext)) icon = "📝";

  document.getElementById("dropContent").innerHTML = `
    <div class="file-chip">
      <span>${icon}</span>
      <span>${file.name}</span>
    </div>
    <div class="dropzone-subtitle" style="margin-top:4px;">${sizeMB} MB • V5 Authenticated Stream Ready</div>
  `;

  const badge = document.getElementById("fileBadge");
  let isLocked = false;
  let modeName = "Encrypted";

  if (file.size >= FOOTER_LEN_V5) {
    const foot5 = new Uint8Array(await file.slice(file.size - FOOTER_LEN_V5, file.size).arrayBuffer());
    const m = String.fromCharCode(...foot5.slice(0, 8));
    if (m === MAGIC_V5) {
      isLocked = true;
      modeName = "🔒 V5 Full AEAD Armor";
    }
  }
  if (!isLocked && file.size >= FOOTER_LEN_V4) {
    const foot4 = new Uint8Array(await file.slice(file.size - FOOTER_LEN_V4, file.size).arrayBuffer());
    const m = String.fromCharCode(...foot4.slice(0, 8));
    if (m === MAGIC_V4 || m === MAGIC_V3) {
      isLocked = true;
      modeName = "🔒 V4 Full Armor";
    }
  }

  if (isLocked) {
    badge.className = "status-badge badge-locked";
    badge.innerHTML = modeName;
  } else {
    badge.className = "status-badge badge-unlocked";
    badge.innerHTML = "🔓 Unencrypted";
  }
}

const fileInput = document.getElementById("fileInput");
fileInput.addEventListener("change", (e) => {
  if (e.target.files && e.target.files.length) updateFileUI(e.target.files[0]);
});

const dropZone = document.getElementById("dropZone");
dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("dragover"); });
dropZone.addEventListener("dragleave", () => { dropZone.classList.remove("dragover"); });
dropZone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropZone.classList.remove("dragover");
  if (e.dataTransfer.files && e.dataTransfer.files.length) {
    fileInput.files = e.dataTransfer.files;
    updateFileUI(e.dataTransfer.files[0]);
  }
});

function showToast(msg, type) {
  const el = document.getElementById("toastAlert");
  el.style.display = "block";
  el.className = "toast-alert alert-" + type;
  el.innerHTML = msg;
}

function renderMediaPreview(blob, filename) {
  clearMemoryAndPreview();
  const wrapper = document.getElementById("previewWrapper");
  wrapper.style.display = "block";

  const ext = filename.split('.').pop().toLowerCase();
  activeObjectUrl = URL.createObjectURL(blob);

  const panicBar = document.createElement("div");
  panicBar.className = "panic-bar";
  panicBar.innerHTML = `
    <span style="font-size:0.75rem; color:var(--text-secondary);">🔒 Authenticated In-Memory Stream (Auto-wipe in 3m)</span>
    <button class="panic-btn" onclick="clearMemoryAndPreview()">Wipe RAM</button>
  `;
  wrapper.appendChild(panicBar);

  if (['mp4','webm','mkv','mov','avi','vid'].includes(ext)) {
    const video = document.createElement("video");
    video.src = activeObjectUrl;
    video.controls = true;
    video.playsInline = true;
    video.autoplay = true;
    wrapper.appendChild(video);
  } else if (['mp3','wav','ogg','flac','m4a'].includes(ext)) {
    const audio = document.createElement("audio");
    audio.src = activeObjectUrl;
    audio.controls = true;
    audio.autoplay = true;
    audio.style.padding = "20px";
    wrapper.appendChild(audio);
  } else if (['jpg','jpeg','png','gif','webp','svg','bmp'].includes(ext)) {
    const img = document.createElement("img");
    img.src = activeObjectUrl;
    wrapper.appendChild(img);
  } else if (['pdf'].includes(ext)) {
    const iframe = document.createElement("iframe");
    iframe.src = activeObjectUrl;
    wrapper.appendChild(iframe);
  } else if (['txt','json','py','js','html','css','csv','md','log','xml'].includes(ext)) {
    const reader = new FileReader();
    reader.onload = () => {
      const pre = document.createElement("pre");
      pre.className = "text-preview";
      pre.textContent = reader.result;
      wrapper.appendChild(pre);
    };
    reader.readAsText(blob);
  } else {
    const box = document.createElement("div");
    box.style.padding = "24px";
    box.style.textAlign = "center";
    box.style.color = "var(--text-secondary)";
    box.innerHTML = `<div style="font-size: 2rem; margin-bottom: 8px;">📦</div><strong>${filename}</strong><div style="font-size: 0.8rem; margin-top: 4px;">Verified in RAM. Click <strong>Unlock & Save</strong> to export.</div>`;
    wrapper.appendChild(box);
  }

  autoWipeTimer = setTimeout(() => {
    clearMemoryAndPreview();
    showToast("🛡️ RAM Auto-Wiped for security after 3 minutes.", "info");
  }, 180000);
}

async function deriveKeysV5(password, salt) {
  const enc = new TextEncoder();
  const passKey = await crypto.subtle.importKey(
    "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveBits"]
  );
  const derivedBits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: salt, iterations: KDF_ITERS_V5, hash: "SHA-256" },
    passKey, 512
  );
  const dk = new Uint8Array(derivedBits);
  const encKeyBytes = dk.slice(0, 32);
  const macKeyBytes = dk.slice(32, 64);

  const hmacKey = await crypto.subtle.importKey(
    "raw", macKeyBytes, { name: "HMAC", hash: "SHA-256" }, false, ["sign", "verify"]
  );
  const tagData = new Uint8Array(13 + 16);
  tagData.set(enc.encode("VAULT_AUTH_V5"), 0);
  tagData.set(salt, 13);
  const fullAuthTag = new Uint8Array(await crypto.subtle.sign("HMAC", hmacKey, tagData));
  const authTag = fullAuthTag.slice(0, 16);

  return { encKeyBytes, macKeyBytes, hmacKey, authTag };
}

async function handleAction(action) {
  const passInput = document.getElementById("passInput");

  if (lockoutSecondsRemaining > 0) {
    showToast(`🛑 Lockout active. Please wait ${lockoutSecondsRemaining}s.`, "warning");
    return;
  }

  if (!fileInput.files || !fileInput.files.length) {
    showToast("⚠️ <strong>No file selected</strong>. Tap above to select a file.", "error");
    return;
  }
  const password = passInput.value;
  if (!password) {
    showToast("⚠️ <strong>Password required</strong>. Please enter your master key.", "error");
    passInput.focus();
    return;
  }

  const file = fileInput.files[0];
  const t0 = performance.now();
  showToast("⚡ Processing authenticated cryptographic stream in RAM...", "info");

  try {
    const fileSize = file.size;

    if (action === "unlock" || action === "play") {
      let version = 0;
      let footerBuf = null;
      let footerLen = 0;

      if (fileSize >= FOOTER_LEN_V5) {
        const buf = new Uint8Array(await file.slice(fileSize - FOOTER_LEN_V5, fileSize).arrayBuffer());
        const m = String.fromCharCode(...buf.slice(0, 8));
        if (m === MAGIC_V5) { version = 5; footerBuf = buf; footerLen = FOOTER_LEN_V5; }
      }
      if (!version && fileSize >= FOOTER_LEN_V4) {
        const buf = new Uint8Array(await file.slice(fileSize - FOOTER_LEN_V4, fileSize).arrayBuffer());
        const m = String.fromCharCode(...buf.slice(0, 8));
        if (m === MAGIC_V4) { version = 4; footerBuf = buf; footerLen = FOOTER_LEN_V4; }
      }

      if (!version) {
        if (action === "play") {
          renderMediaPreview(file, file.name);
          showToast("ℹ️ <strong>Direct Preview</strong>: File is unencrypted.", "success");
          return;
        } else {
          showToast("ℹ️ This file is already unlocked.", "info");
          return;
        }
      }

      const dataLen = fileSize - footerLen;
      const salt = footerBuf.slice(12, 28);
      const nonce = footerBuf.slice(28, 44);
      const mime = getMimeType(file.name);

      if (version === 5) {
        const storedMac = footerBuf.slice(44, 76);
        const storedAuthTag = footerBuf.slice(76, 92);

        const cryptoInfo = await deriveKeysV5(password, salt);

        // Constant-time AuthTag verification
        let diff = 0;
        for (let i = 0; i < 16; i++) diff |= (storedAuthTag[i] ^ cryptoInfo.authTag[i]);

        if (diff !== 0) {
          failedAttempts++;
          cryptoInfo.encKeyBytes.fill(0);
          cryptoInfo.macKeyBytes.fill(0);

          if (failedAttempts >= 10) startLockoutCooldown(60);
          else if (failedAttempts >= 5) startLockoutCooldown(10);
          else if (failedAttempts >= 3) startLockoutCooldown(3);

          showToast(`❌ <strong>INCORRECT PASSWORD</strong> (${failedAttempts} failed attempts).`, "error");
          return;
        }

        failedAttempts = 0;

        // Ciphertext integrity verification (Anti-Tampering HMAC)
        const cipherBlob = file.slice(0, dataLen);
        const cipherBuf = new Uint8Array(await cipherBlob.arrayBuffer());
        const computedMac = new Uint8Array(await crypto.subtle.sign("HMAC", cryptoInfo.hmacKey, cipherBuf));

        let macDiff = 0;
        for (let i = 0; i < 32; i++) macDiff |= (storedMac[i] ^ computedMac[i]);

        if (macDiff !== 0) {
          showToast("❌ <strong>INTEGRITY CORRUPTION</strong>: Ciphertext was modified or corrupted! Decryption halted.", "error");
          return;
        }

        // Authenticated Stream Decryption via AES-CTR
        const aesKey = await crypto.subtle.importKey(
          "raw", cryptoInfo.encKeyBytes, { name: "AES-CTR" }, false, ["decrypt"]
        );
        const decryptedBuf = await crypto.subtle.decrypt(
          { name: "AES-CTR", counter: nonce, length: 128 },
          aesKey, cipherBuf
        );

        cryptoInfo.encKeyBytes.fill(0);
        cryptoInfo.macKeyBytes.fill(0);

        const restoredBlob = new Blob([decryptedBuf], { type: mime });
        const elapsed = (performance.now() - t0).toFixed(1);

        if (action === "play") {
          renderMediaPreview(restoredBlob, file.name);
          showToast(`⚡ <strong>Verified & Decrypted in ${elapsed}ms</strong> • Streaming in RAM`, "success");
        } else {
          downloadBlob(restoredBlob, file.name);
          showToast(`✅ <strong>Restored in ${elapsed}ms!</strong> (AEAD Integrity Verified)`, "success");
        }
      }

    } else if (action === "lock") {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const nonce = crypto.getRandomValues(new Uint8Array(16));
      const cryptoInfo = await deriveKeysV5(password, salt);

      const fileBuf = new Uint8Array(await file.arrayBuffer());

      // Encrypt 100% full file with AES-CTR
      const aesKey = await crypto.subtle.importKey(
        "raw", cryptoInfo.encKeyBytes, { name: "AES-CTR" }, false, ["encrypt"]
      );
      const cipherBuf = new Uint8Array(await crypto.subtle.encrypt(
        { name: "AES-CTR", counter: nonce, length: 128 },
        aesKey, fileBuf
      ));

      // Calculate master HMAC-SHA256 over ciphertext (Encrypt-then-MAC)
      const masterMac = new Uint8Array(await crypto.subtle.sign("HMAC", cryptoInfo.hmacKey, cipherBuf));

      // Build V5 Footer (96 bytes)
      const footer = new Uint8Array(FOOTER_LEN_V5);
      for (let i = 0; i < 8; i++) footer[i] = MAGIC_V5.charCodeAt(i);
      new DataView(footer.buffer).setUint32(8, 65536, true);
      footer.set(salt, 12);
      footer.set(nonce, 28);
      footer.set(masterMac, 44);
      footer.set(cryptoInfo.authTag, 76);
      new DataView(footer.buffer).setUint16(92, 0, true);
      new DataView(footer.buffer).setUint16(94, 1, true);

      cryptoInfo.encKeyBytes.fill(0);
      cryptoInfo.macKeyBytes.fill(0);

      const lockedBlob = new Blob([cipherBuf, footer], { type: "application/octet-stream" });
      const elapsed = (performance.now() - t0).toFixed(1);

      downloadBlob(lockedBlob, file.name);
      showToast(`🔒 <strong>Locked in ${elapsed}ms!</strong> (100% Full-File AEAD + 250k PBKDF2).`, "success");
    }
  } catch (err) {
    showToast("❌ <strong>Error</strong>: " + err.message, "error");
  }
}

function downloadBlob(blob, filename) {
  const a = document.createElement("a");
  const url = URL.createObjectURL(blob);
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
